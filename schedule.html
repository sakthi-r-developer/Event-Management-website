<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Schedule - TechIf</title>

<link rel="stylesheet" href="schedule.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        <h2>TechIf</h2>
    </div>

    <div class="user-section">
        <span id="navbarUser"></span>
        <button id="logoutBtn">Logout</button>
    </div>

</header>

<div class="container">

    <aside class="sidebar">

    <h4>MAIN</h4>

    <a href="home.html">
        <i class="fa-solid fa-house"></i> Home
    </a>

    <a href="event.html">
        <i class="fa-solid fa-calendar"></i> Events
    </a>

    <a href="schedule.html">
        <i class="fa-solid fa-clock"></i> Schedule
    </a>

    <a href="gallery.html">
        <i class="fa-solid fa-image"></i> Gallery
    </a>

    <a href="leaderboard.html">
        <i class="fa-solid fa-trophy"></i> Leaderboard
    </a>

    <a href="announcements.html">
        <i class="fa-solid fa-bullhorn"></i> Announcements
    </a>

    <h4>ACCOUNT</h4>

    <a href="profile.html">
        <i class="fa-solid fa-user"></i> Profile
    </a>

    <a href="settings.html">
        <i class="fa-solid fa-gear"></i> Settings
    </a>

    <a href="contact.html">
        <i class="fa-solid fa-phone"></i> Contact Us
    </a>

</aside>

    <main class="content">

        <h1>Event Schedule</h1>

        <div class="schedule-card">

            <div class="schedule-item">
                <span class="time">09:00 AM</span>
                <span class="event">Opening Ceremony</span>
            </div>

            <div class="schedule-item">
                <span class="time">10:00 AM</span>
                <span class="event">HackIt 2.0 Begins</span>
            </div>

            <div class="schedule-item">
                <span class="time">01:00 PM</span>
                <span class="event">Lunch Break</span>
            </div>

            <div class="schedule-item">
                <span class="time">02:00 PM</span>
                <span class="event">Technical Workshop</span>
            </div>

            <div class="schedule-item">
                <span class="time">05:00 PM</span>
                <span class="event">Project Presentation</span>
            </div>

            <div class="schedule-item">
                <span class="time">06:00 PM</span>
                <span class="event">Prize Distribution</span>
            </div>

        </div>

    </main>

</div>

<script src="schedule.js"></script>
